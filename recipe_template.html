<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>厨房小笺 · Fridge Rescue</title>
<style>
:root{--paper:#f7f3ea;--ink:#474a40;--muted:#777b6c;--sage:#84947a;--rose:#c58e7d;--line:#dddccd}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.8 "Microsoft YaHei","PingFang SC",sans-serif;background-size:5px 5px}button,label.import{font:inherit;cursor:pointer;color:inherit}button{background:transparent;border:1px solid var(--line);border-radius:16px;padding:8px 16px}button:hover,label.import:hover{background:#e6eadf}button:focus-visible,input:focus-visible,summary:focus-visible,label.import:focus-within{outline:3px solid var(--sage);outline-offset:4px}header{max-width:1120px;margin:auto;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}.brand{font-family:Georgia,serif;font-size:21px;letter-spacing:.06em}.brand small{display:block;font:10px/1.3 sans-serif;letter-spacing:.25em;color:var(--muted)}.import{font-size:13px!important}.import input{position:absolute;width:1px;height:1px;opacity:0}.hero{max-width:1060px;margin:46px auto 30px;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;padding:0 24px}.eyebrow{font-size:12px;letter-spacing:.25em;color:var(--sage)}h1{font:42px/1.4 Georgia,"KaiTi","STKaiti",serif;margin:15px 0 12px;letter-spacing:.06em}.intro{color:var(--muted);max-width:470px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.badge{border:1px solid var(--line);border-radius:40% 50% 45% 50%;padding:4px 13px;font-size:12px;background:#edf0e68c}.hero svg{width:100%;height:260px}.shell{max-width:1060px;margin:auto;padding:0 24px 60px}.ribbon{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 18px;background:#e5e9dd9c;border-radius:18px 8px 19px 10px;margin-bottom:24px;font-size:13px}.ribbon span{color:var(--muted)}.grid{display:grid;grid-template-columns:320px 1fr;gap:26px;align-items:start}.card{background:#fffdf7d9;border:1px solid #dedfd0;border-radius:8px 22px 12px 18px;padding:26px;box-shadow:3px 5px 0 #d5d9c324}.card h2{font:25px/1.5 "KaiTi","STKaiti",serif;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin:0 0 22px}.ingredient{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:flex-start}.ingredient:last-child{border-bottom:0}.ingredient input{accent-color:var(--sage);margin-top:7px;width:17px;height:17px;flex-shrink:0}.ingredient:has(input:checked) span{text-decoration:line-through;color:var(--muted)}.step{display:grid;grid-template-columns:38px 1fr;gap:14px;padding:22px 0;border-bottom:1px dashed var(--line)}.step:last-child{border-bottom:0}.step-number{padding:0;width:36px;height:36px;border-color:#aeb99f;border-radius:47% 42% 50% 43%;background:#e7ecdf;font:19px Georgia,serif}.step.done .step-number{background:var(--sage);color:white}.step.done .instruction{color:var(--muted);text-decoration:line-through}.instruction{margin:0;font-size:16px;line-height:1.9}.time{font:11px sans-serif;color:var(--muted);margin-bottom:6px}.notes{font-size:12px;color:#987366;margin-top:10px}.step details{font-size:12px;color:var(--muted);margin-top:9px}.step details p{margin:6px 0;overflow-wrap:anywhere}summary{cursor:pointer}.footer-note{font-size:12px;color:var(--muted);margin-top:24px}.extras{margin-top:24px}.extras details{padding:12px 0;border-bottom:1px dashed var(--line)}.extras p{font-size:13px}.progress{height:3px;background:#d8decf;width:100%;border-radius:6px;margin-top:10px}.progress div{height:100%;background:var(--sage);transition:width .2s}.empty{color:var(--muted);font-size:13px}#message{color:#9a614e;font-size:13px}footer{text-align:center;font:12px Georgia,serif;letter-spacing:.12em;color:var(--muted);padding:28px}.controls{display:flex;gap:8px;align-items:center}
@media(max-width:720px){header{padding:18px 20px}.brand{font-size:17px}.controls button{padding:6px 10px}.hero{margin-top:25px;grid-template-columns:1fr;gap:0}h1{font-size:32px}.hero svg{height:180px}.grid{grid-template-columns:1fr}.ribbon{align-items:flex-start;flex-direction:column}.card{padding:22px}.shell{padding:0 18px 35px}}
@media print{body{background:white}header .controls,.ribbon button,.import,.progress{display:none}.hero{margin:15px auto}.hero svg{height:140px}.grid{grid-template-columns:30% 1fr;gap:15px}.card{box-shadow:none;padding:15px}.step{break-inside:avoid}footer{padding:10px}.extras{display:none}}

__VISUAL_STYLE__
</style></head><body>
<header><div class="brand">Fridge Rescue<small>厨房小笺 · COOK WITH WHAT YOU HAVE</small></div><div class="controls"><label class="import">打开食谱<input id="file" type="file" accept=".json,application/json"></label><button id="print">打印 / PDF</button></div></header>
<main><section class="hero"><div><div class="eyebrow">一份食谱，一点生活的滋味</div><h1 id="title">厨房里的这道菜</h1><p class="intro">把材料备好，让步骤慢下来。<br>照着这张小笺，一步一步完成今天的料理。</p><div class="badges"><span class="badge" id="method">视频食谱草稿</span><span class="badge">原文可追溯 · 需核对</span></div></div>
<svg viewBox="0 0 430 290" role="img" aria-label="水彩手绘风格的蔬菜与料理碗装饰"><defs><filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/></filter><radialGradient id="tom"><stop stop-color="#d9a08b"/><stop offset="1" stop-color="#b67e71" stop-opacity=".7"/></radialGradient></defs><g filter="url(#wash)"><ellipse cx="225" cy="240" rx="151" ry="13" fill="#c6cbb1" opacity=".32"/><path d="M86 136 Q93 245 224 247 Q346 242 357 136Z" fill="#d8dfcd" stroke="#8c9b82" stroke-width="2"/><ellipse cx="222" cy="137" rx="137" ry="47" fill="#f1eedf" stroke="#919e85" stroke-width="2"/><ellipse cx="222" cy="140" rx="114" ry="32" fill="#d1a18a" opacity=".55"/><path d="M154 151Q210 130 285 153M141 138Q198 116 301 139" fill="none" stroke="#e9cfaa" stroke-width="7" opacity=".8"/><path d="M257 129Q232 83 271 48Q284 78 257 129Z" fill="#91a18a"/><path d="M263 124Q291 84 326 88Q307 124 263 124Z" fill="#a6b198"/><path d="M252 128L282 65" stroke="#75866a" fill="none"/><path d="M312 135L373 63M328 143L387 72" stroke="#ae9477" stroke-width="7" stroke-linecap="round"/><path d="M137 195Q213 231 298 196" fill="none" stroke="#9cad93" stroke-width="2"/><ellipse cx="89" cy="230" rx="32" ry="27" fill="url(#tom)"/><path d="M90 202L79 192L88 198L99 190L96 200L108 203L94 205" fill="#879579"/><path d="M337 226Q365 173 391 197Q402 229 346 243Z" fill="#b7c3a4" stroke="#8d9e7e" stroke-width="1.5"/><path d="M344 236L383 206M354 218L364 221M366 211L374 216" stroke="#899b7c" fill="none"/><path d="M76 99Q62 70 79 66Q94 75 86 96M80 96Q101 70 110 84Q108 103 80 105" fill="#a7b293" opacity=".8"/></g><g fill="#a5ad91" opacity=".5"><circle cx="123" cy="57" r="3"/><circle cx="348" cy="41" r="2"/><circle cx="54" cy="161" r="3"/></g></svg></section>
<div class="shell"><div class="ribbon"><div>今天的料理进度 <strong id="count">0 / 0</strong><div class="progress"><div id="bar" style="width:0"></div></div></div><span>材料可勾选 · 点击步骤编号标记完成</span><button id="reset">重新开始</button></div><p id="message" role="status"></p><div class="grid"><aside class="card"><h2>备好材料</h2><p class="sub">按视频原文整理，用量未说明时不补写。</p><div id="ingredients"></div><p class="footer-note">这是一份待核对的草稿。开始做菜前，请确认材料、用量和关键操作。</p></aside><section class="card"><h2>慢慢做，刚刚好</h2><p class="sub">每一步都可以展开查看原文依据。</p><div id="steps"></div></section></div><section class="card extras"><h2>厨房旁注</h2><details><summary>需要核对的地方</summary><div id="uncertainties"></div></details><details><summary>闲聊与其他原文</summary><div id="context"></div></details></section></div></main><footer>Fridge Rescue · 把厨房里的小事，做成生活里的好事</footer>
<script type="application/json" id="recipe-data">__RECIPE_DATA__</script>
<script>
'use strict';let current,done=new Set(),key='';const $=id=>document.getElementById(id);function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function stamp(n){if(!Number.isFinite(n))return '时间未记录';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}function persist(){try{localStorage.setItem(key,JSON.stringify([...done]))}catch(e){}}function progress(){const total=$('steps').children.length;$('count').textContent=done.size+' / '+total;$('bar').style.width=(total?100*done.size/total:0)+'%'}
function show(data){if(!data||typeof data!=='object'||!Array.isArray(data.steps))throw Error('请选择本程序生成的 recipe.json');current=data;const ai=data.deepseek||((Array.isArray(data.classification)&&data.steps.some(x=>x.text))?data:null),model=ai||data;const records=data.evidence||[];const ingredients=model.ingredients||[];const steps=model.steps||[];key='fridge-recipe-'+JSON.stringify(steps.map(s=>s.text||s.instruction));try{done=new Set(JSON.parse(localStorage.getItem(key)||'[]').filter(i=>Number.isInteger(i)&&i>=0&&i<steps.length))}catch(e){done=new Set()}let title=data.title||'';if(!title){const explicit=records.find(r=>/西班牙冷汤/.test(r.text));title=explicit?'西班牙冷汤':(data.dish_name_candidates?.[0]?.text||'厨房里的这道菜')}$('title').textContent=title;$('method').textContent=ai?'AI 整理 · 原文草稿':'本地整理 · 原文草稿';document.title=title+' · Fridge Rescue';for(const id of ['ingredients','steps','uncertainties','context'])$(id).replaceChildren();ingredients.forEach(i=>{let label=el('label',undefined,'ingredient'),box=document.createElement('input');box.type='checkbox';label.append(box,el('span',i.text||''));$('ingredients').append(label)});if(!ingredients.length)$('ingredients').append(el('p','未提取到独立材料，请核对步骤和原文。','empty'));
steps.forEach((s,i)=>{let row=el('article',undefined,'step'+(done.has(i)?' done':'')),number=el('button',String(i+1),'step-number');number.setAttribute('aria-label','标记第 '+(i+1)+' 步完成');number.setAttribute('aria-pressed',done.has(i));number.onclick=()=>{done.has(i)?done.delete(i):done.add(i);row.classList.toggle('done',done.has(i));number.setAttribute('aria-pressed',done.has(i));persist();progress()};let content=el('div');content.append(el('div',stamp(s.start)+' — '+stamp(s.end),'time'),el('p',s.text||s.instruction||'','instruction'));if(s.review_notes?.length)content.append(el('p',s.review_notes.join(' '),'notes'));let refs=s.evidence||(s.evidence_ids||[]).map(id=>records[id]).filter(Boolean);if(refs.length){let detail=el('details');detail.append(el('summary','查看原文依据'));refs.forEach(r=>detail.append(el('p',stamp(r.start)+' · '+(r.source==='ocr'?'字幕':'语音')+'：'+r.text)));content.append(detail)}row.append(number,content);$('steps').append(row)});if(!steps.length)$('steps').append(el('p','没有检测到步骤，请查看原文。','empty'));(ai?.uncertainties||[]).forEach(t=>$('uncertainties').append(el('p',t)));if(!ai?.uncertainties?.length)$('uncertainties').append(el('p','请核对识别差异、食材用量和视频中的操作。'));const context=ai?(ai.classification||[]).filter(x=>['narration','uncertain','explanation'].includes(x.category)).map(x=>records[x.id]).filter(Boolean):[...(data.narration||[]),...(data.context||[])];const seen=new Set();context.forEach(r=>{if(seen.has(r.text))return;seen.add(r.text);$('context').append(el('p',stamp(r.start)+' · '+r.text))});if(!context.length)$('context').append(el('p','暂无其他原文。'));$('message').textContent='';progress()}
$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024)throw Error('文件过大，请选择小于 10MB 的食谱 JSON');show(JSON.parse(await f.text()))}catch(err){$('message').textContent=err.message}};$('print').onclick=()=>window.print();$('reset').onclick=()=>{done.clear();persist();show(current)};try{show(JSON.parse($('recipe-data').textContent))}catch(err){$('message').textContent=err.message}
</script></body></html>
